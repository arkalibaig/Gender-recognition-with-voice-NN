<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceID</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e2e0d8;
    --text: #1a1917;
    --muted: #8a8880;
    --accent: #2563eb;
    --accent-light: #eff4ff;
    --male: #1d4ed8;
    --female: #db2777;
    --success-bg: #f0fdf4;
    --error: #dc2626;
    --radius: 16px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--text);
  }

  .wrapper {
    width: 100%;
    max-width: 480px;
  }

  .header {
    margin-bottom: 32px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--text);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg {
    width: 18px;
    height: 18px;
    fill: white;
  }

  .logo-text {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  .tagline {
    font-size: 13px;
    color: var(--muted);
    font-weight: 400;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow);
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .drop-zone {
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 36px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .drop-zone input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .drop-icon {
    width: 40px;
    height: 40px;
    margin: 0 auto 12px;
    background: var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .drop-zone:hover .drop-icon {
    background: var(--accent);
  }

  .drop-zone:hover .drop-icon svg {
    stroke: white;
  }

  .drop-icon svg {
    width: 18px;
    height: 18px;
    stroke: var(--muted);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.2s;
  }

  .drop-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }

  .drop-sub {
    font-size: 12px;
    color: var(--muted);
  }

  .file-preview {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-top: 12px;
  }

  .file-preview.visible { display: flex; }

  .file-icon {
    width: 36px;
    height: 36px;
    background: var(--accent-light);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .file-icon svg {
    width: 16px;
    height: 16px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 2;
  }

  .file-info { flex: 1; min-width: 0; }

  .file-name {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-size {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  .remove-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: var(--muted);
    border-radius: 4px;
    transition: color 0.15s;
  }

  .remove-btn:hover { color: var(--error); }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 24px 0;
  }

  .audio-player {
    display: none;
    margin-top: 12px;
  }

  .audio-player.visible { display: block; }

  .audio-player audio {
    width: 100%;
    height: 36px;
    border-radius: 8px;
    outline: none;
  }

  .btn {
    width: 100%;
    padding: 13px;
    background: var(--text);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: -0.1px;
  }

  .btn:hover:not(:disabled) {
    background: #2d2c2a;
    transform: translateY(-1px);
    box-shadow: var(--shadow-lg);
  }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .result {
    display: none;
    margin-top: 20px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    animation: fadeUp 0.3s ease;
  }

  .result.visible { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-header {
    padding: 20px 20px 16px;
  }

  .result-header.male { background: #eff6ff; }
  .result-header.female { background: #fdf2f8; }

  .result-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .result-label.male { color: var(--male); }
  .result-label.female { color: var(--female); }

  .result-prediction {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }

  .result-prediction.male { color: var(--male); }
  .result-prediction.female { color: var(--female); }

  .result-body {
    padding: 16px 20px;
    background: white;
  }

  .confidence-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .confidence-text {
    font-size: 12px;
    color: var(--muted);
  }

  .confidence-value {
    font-size: 13px;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
  }

  .confidence-bar {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .confidence-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    width: 0%;
  }

  .confidence-fill.male { background: var(--male); }
  .confidence-fill.female { background: var(--female); }

  .error-msg {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    background: #fff5f5;
    border: 1px solid #fecaca;
    border-radius: 10px;
    font-size: 13px;
    color: var(--error);
  }

  .error-msg.visible { display: block; }

  .footer {
    margin-top: 20px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
  }

  .footer span {
    font-family: 'DM Mono', monospace;
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
        </svg>
      </div>
      <span class="logo-text">VoiceID</span>
    </div>
    <p class="tagline">Gender classification from voice audio</p>
  </div>

  <div class="card">
    <p class="section-label">Upload Audio</p>

    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.flac,.m4a">
      <div class="drop-icon">
        <svg viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <p class="drop-title">Drop your audio file here</p>
      <p class="drop-sub">MP3, WAV, OGG, FLAC supported</p>
    </div>

    <div class="file-preview" id="filePreview">
      <div class="file-icon">
        <svg viewBox="0 0 24 24">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <div class="file-info">
        <p class="file-name" id="fileName"></p>
        <p class="file-size" id="fileSize"></p>
      </div>
      <button class="remove-btn" id="removeBtn" title="Remove file">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="audio-player" id="audioPlayer">
      <audio id="audioEl" controls></audio>
    </div>

    <div class="divider"></div>

    <button class="btn" id="predictBtn" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      <span id="btnText">Analyse Voice</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <div class="error-msg" id="errorMsg"></div>

    <div class="result" id="result">
      <div class="result-header" id="resultHeader">
        <p class="result-label" id="resultLabel">Prediction</p>
        <p class="result-prediction" id="resultPrediction"></p>
      </div>
      <div class="result-body">
        <div class="confidence-row">
          <span class="confidence-text">Confidence</span>
          <span class="confidence-value" id="confidenceValue"></span>
        </div>
        <div class="confidence-bar">
          <div class="confidence-fill" id="confidenceFill"></div>
        </div>
      </div>
    </div>
  </div>

  <p class="footer">Inference via <span>localhost:8000</span> &nbsp;·&nbsp; Model trained on 15,070 samples</p>
</div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const filePreview = document.getElementById('filePreview');
  const fileName = document.getElementById('fileName');
  const fileSize = document.getElementById('fileSize');
  const removeBtn = document.getElementById('removeBtn');
  const audioPlayer = document.getElementById('audioPlayer');
  const audioEl = document.getElementById('audioEl');
  const predictBtn = document.getElementById('predictBtn');
  const btnText = document.getElementById('btnText');
  const spinner = document.getElementById('spinner');
  const result = document.getElementById('result');
  const resultHeader = document.getElementById('resultHeader');
  const resultLabel = document.getElementById('resultLabel');
  const resultPrediction = document.getElementById('resultPrediction');
  const confidenceValue = document.getElementById('confidenceValue');
  const confidenceFill = document.getElementById('confidenceFill');
  const errorMsg = document.getElementById('errorMsg');

  let selectedFile = null;

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function setFile(file) {
    selectedFile = file;
    fileName.textContent = file.name;
    fileSize.textContent = formatSize(file.size);
    filePreview.classList.add('visible');
    audioEl.src = URL.createObjectURL(file);
    audioPlayer.classList.add('visible');
    predictBtn.disabled = false;
    result.classList.remove('visible');
    errorMsg.classList.remove('visible');
  }

  function clearFile() {
    selectedFile = null;
    fileInput.value = '';
    filePreview.classList.remove('visible');
    audioPlayer.classList.remove('visible');
    audioEl.src = '';
    predictBtn.disabled = true;
    result.classList.remove('visible');
    errorMsg.classList.remove('visible');
  }

  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) setFile(e.target.files[0]);
  });

  removeBtn.addEventListener('click', clearFile);

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) setFile(file);
  });

  predictBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    // loading state
    predictBtn.disabled = true;
    btnText.textContent = 'Analysing...';
    spinner.style.display = 'block';
    result.classList.remove('visible');
    errorMsg.classList.remove('visible');

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const res = await fetch('http://localhost:8000/predict', {
        method: 'POST',
        body: formData
      });

      if (!res.ok) throw new Error(`Server returned ${res.status}`);

      const data = await res.json();
      // expected: { prediction: "Male" | "Female", confidence: 0.99 }

      const isMale = data.prediction === 'Male';
      const gender = isMale ? 'male' : 'female';
      const pct = Math.round(data.confidence * 100);

      resultHeader.className = `result-header ${gender}`;
      resultLabel.className = `result-label ${gender}`;
      resultPrediction.className = `result-prediction ${gender}`;
      resultPrediction.textContent = data.prediction;
      confidenceValue.textContent = `${pct}%`;
      confidenceFill.className = `confidence-fill ${gender}`;

      result.classList.add('visible');
      setTimeout(() => { confidenceFill.style.width = pct + '%'; }, 50);

    } catch (err) {
      errorMsg.textContent = err.message.includes('Failed to fetch')
        ? 'Could not reach the server. Make sure the FastAPI backend is running on localhost:8000.'
        : `Error: ${err.message}`;
      errorMsg.classList.add('visible');
    } finally {
      predictBtn.disabled = false;
      btnText.textContent = 'Analyse Voice';
      spinner.style.display = 'none';
    }
  });
</script>
</body>
</html>
